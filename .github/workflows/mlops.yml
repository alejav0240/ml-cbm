name: ML and MLOps

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Run MLOps and inference tests
        run: >-
          python -m unittest
          test_mlops_registry.py
          test_mlops_drift.py
          test_service.py
          test_phase2_inference.py
          test_predict_dataset.py
      - name: Validate CLI contract
        run: python -m mlops.cli --help

  train-and-publish:
    name: Train, gate and publish model image
    runs-on: ubuntu-24.04
    needs: quality
    if: >-
      ${{
        github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      }}
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      ML_APPROVALS_JSON: ${{ secrets.ML_APPROVALS_JSON }}
      MIN_MICRO_F1: ${{ vars.ML_MIN_MICRO_F1 || '0.70' }}
    steps:
      - name: Checkout ML repository
        uses: actions/checkout@v4

      - name: Checkout approved dataset
        uses: actions/checkout@v4
        with:
          repository: alejav0240/dataset-ml
          ref: main
          path: dataset

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install training dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Materialize protected approvals
        run: |
          set -euo pipefail
          test -n "$ML_APPROVALS_JSON" || {
            echo "ML_APPROVALS_JSON repository secret is required for production training." >&2
            exit 1
          }
          printf '%s' "$ML_APPROVALS_JSON" > approvals.json
          python -m json.tool approvals.json >/dev/null

      - name: Train and track model
        run: |
          set -euo pipefail
          python run_pipeline.py \
            --sessions-dir dataset/dataset/sessions \
            --approvals approvals.json \
            --out-dir artifacts \
            --no-mlflow

      - name: Register and promote candidate
        id: version
        run: |
          set -euo pipefail
          version="v$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::12}"
          python -m mlops.cli register \
            --artifacts-dir artifacts \
            --registry artifacts/registry.json \
            --version "$version"
          python -m mlops.cli promote \
            --registry artifacts/registry.json \
            --version "$version" \
            --min-micro-f1 "$MIN_MICRO_F1"
          python -m mlops.cli deploy \
            --registry artifacts/registry.json \
            --version "$version" \
            --out-dir artifacts/production
          mkdir -p deployment
          cp artifacts/production/model.json deployment/model.json
          cp artifacts/production/deployment.json deployment/deployment.json
          printf '%s\n' "$version" > deployment/version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish inference image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-inference:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-inference:${{ github.sha }}

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ml-release-${{ steps.version.outputs.version }}
          path: |
            artifacts/registry.json
            artifacts/metrics.json
            artifacts/pipeline_status.json
            artifacts/patient-split.json
            artifacts/event-windows.csv
            artifacts/production/deployment.json
          if-no-files-found: error
          retention-days: 90

  deploy-production:
    name: Deploy inference service
    runs-on: ubuntu-24.04
    needs: train-and-publish
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}-inference:${{ needs.train-and-publish.outputs.version }}
      DEPLOY_PATH: ${{ vars.ML_DEPLOY_PATH || '/opt/cbm/ml' }}
      DOCKER_NETWORK: ${{ vars.ML_DOCKER_NETWORK || 'cbm_default' }}
      CONTAINER_NAME: ${{ vars.ML_CONTAINER_NAME || 'cbm-ml-inference' }}
      ML_SERVICE_API_KEY: ${{ secrets.ML_SERVICE_API_KEY }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "SSH_PRIVATE_KEY is required"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "SSH_KNOWN_HOSTS is required"; exit 1; }
          test -n "$SSH_HOST" || { echo "SSH_HOST is required"; exit 1; }
          test -n "$SSH_USER" || { echo "SSH_USER is required"; exit 1; }
          test -n "$ML_SERVICE_API_KEY" || { echo "ML_SERVICE_API_KEY is required"; exit 1; }

      - name: Prepare SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Pull and atomically replace inference service
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" bash -s -- \
            "$IMAGE" "$DEPLOY_PATH" "$DOCKER_NETWORK" "$CONTAINER_NAME" \
            "$GHCR_USER" \
            "$(printf '%s' "$GHCR_TOKEN" | base64 -w0)" \
            "$(printf '%s' "$ML_SERVICE_API_KEY" | base64 -w0)" <<'DEPLOY_EOF'
          set -euo pipefail
          IMAGE="$1"
          DEPLOY_PATH="$2"
          DOCKER_NETWORK="$3"
          CONTAINER_NAME="$4"
          GHCR_USER="$5"
          GHCR_TOKEN="$(printf '%s' "$6" | base64 -d)"
          ML_SERVICE_API_KEY="$(printf '%s' "$7" | base64 -d)"

          install -d -m 750 "$DEPLOY_PATH"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          docker network inspect "$DOCKER_NETWORK" >/dev/null
          docker pull "$IMAGE"

          previous_image=""
          if docker container inspect "$CONTAINER_NAME" >/dev/null 2>&1; then
            previous_image="$(docker inspect --format '{{.Config.Image}}' "$CONTAINER_NAME")"
          fi

          run_service() {
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --network "$DOCKER_NETWORK" \
              --network-alias ml-inference \
              -e APP_ENV=production \
              -e ML_SERVICE_API_KEY="$ML_SERVICE_API_KEY" \
              "$1"
          }

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          if ! run_service "$IMAGE"; then
            echo "New inference service could not be started; restoring previous image." >&2
            if [ -n "$previous_image" ]; then
              run_service "$previous_image"
            fi
            exit 1
          fi

          healthy=0
          for attempt in $(seq 1 20); do
            if docker exec "$CONTAINER_NAME" python -c \
              'import json, urllib.request; response=json.load(urllib.request.urlopen("http://127.0.0.1:8010/ready", timeout=2)); assert response["status"] == "ready"'; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "New inference service failed readiness; restoring previous image." >&2
            docker logs "$CONTAINER_NAME" || true
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            if [ -n "$previous_image" ]; then
              run_service "$previous_image"
            fi
            exit 1
          fi

          docker image prune -f >/dev/null
          docker ps --filter "name=$CONTAINER_NAME"
          DEPLOY_EOF

      - name: Verify public health endpoint
        if: ${{ vars.ML_HEALTHCHECK_URL != '' }}
        env:
          HEALTHCHECK_URL: ${{ vars.ML_HEALTHCHECK_URL }}
        run: curl --fail --show-error --silent --retry 10 --retry-delay 5 "$HEALTHCHECK_URL/ready"
