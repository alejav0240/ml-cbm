name: ML and MLOps

on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Run MLOps and inference tests
        run: >-
          python -m unittest
          test_mlops_registry.py
          test_mlops_drift.py
          test_service.py
          test_phase2_inference.py
          test_predict_dataset.py
      - name: Validate CLI contract
        run: python -m mlops.cli --help
